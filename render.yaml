services:
  - type: web
    name: healthstake-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: healthstake-db
          property: connectionString
      - key: DEBUG
        value: false
      - key: APP_NAME
        value: HealthStake API
      - key: APP_VERSION
        value: 1.0.0

databases:
  - name: healthstake-db
    databaseName: healthstake
    user: healthstake_user
    plan: free
